<script>
(async () => {
  const P = JSON.parse(document.getElementById('wp-payload').textContent);
  const STORE = 'webpresentations-key';
  const bytes = s => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  const form = document.getElementById('wp-form'), msg = document.getElementById('wp-message');
  const reveal = () => { document.documentElement.classList.add('wp-ready'); form.password.focus(); };
  if (!window.crypto || !crypto.subtle) { reveal(); msg.textContent = 'This browser cannot open protected pages here.'; return; }
  const open = async k => new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: bytes(P.iv)}, k, bytes(P.data)));
  // Replace the page only after it has finished loading; earlier, browsers append instead.
  const show = async html => {
    if (document.readyState === 'loading') await new Promise(r => document.addEventListener('DOMContentLoaded', r, {once: true}));
    await new Promise(r => setTimeout(r, 0));
    document.open(); document.write(html); document.close();
  };
  for (const store of [sessionStorage, localStorage]) {
    let saved = null;
    try { saved = JSON.parse(store.getItem(STORE) || 'null'); } catch (e) {}
    if (saved && saved.salt === P.salt) {
      try { const k = await crypto.subtle.importKey('raw', bytes(saved.key), 'AES-GCM', false, ['decrypt']); await show(await open(k)); return; }
      catch (e) { try { store.removeItem(STORE); } catch (e2) {} }
    }
  }
  reveal();
  form.addEventListener('submit', async event => {
    event.preventDefault();
    msg.textContent = 'Opening…';
    try {
      const pw = await crypto.subtle.importKey('raw', new TextEncoder().encode(form.password.value), 'PBKDF2', false, ['deriveKey']);
      const k = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: bytes(P.salt), iterations: P.iterations, hash: 'SHA-256'}, pw, {name: 'AES-GCM', length: 256}, true, ['decrypt']);
      const html = await open(k);
      const raw = new Uint8Array(await crypto.subtle.exportKey('raw', k));
      const value = JSON.stringify({salt: P.salt, key: btoa(String.fromCharCode(...raw))});
      try { sessionStorage.setItem(STORE, value); if (form.remember.checked) localStorage.setItem(STORE, value); } catch (e) {}
      await show(html);
    } catch (e) {
      msg.textContent = 'That password is not correct.';
      form.password.select();
    }
  });
})();
</script>
